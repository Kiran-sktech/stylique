<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Stylique</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">STYLIQUE</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" id="nav-login"><i class="fa fa-sign-in-alt" style="font-size:22px"></i></a></li>
        <li><a href="myaccount.html" id="nav-account" style="display:none"><i class="fa fa-user" style="font-size:22px"></i></a></li>
        <li><button id="nav-logout" style="display:none;background:none;border:none;cursor:pointer;font-size:22px"><i class="fa fa-sign-out-alt"></i></button></li>
        <li>
          <a href="cart.html" class="cart-wrap">
            <i class="fa fa-shopping-cart" style="font-size:22px"></i>
            <span class="cart-badge">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <div class="cart-container">
    <h2>Your Cart</h2>

    <!-- Cart items injected here -->
    <div id="cartItemsList"></div>

    <!-- Empty cart message -->
    <div id="emptyMsg" style="display:none;text-align:center;padding:60px 0">
      <i class="fa fa-shopping-cart" style="font-size:50px;color:#ccc;margin-bottom:16px;display:block"></i>
      <p style="font-size:18px;color:#888">Your cart is empty.</p>
      <a href="her.html" class="btn" style="display:inline-block;margin-top:20px">Browse Collection</a>
    </div>

    <!-- Order Summary -->
    <div class="cart-summary" id="cartSummary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Items</span><span id="itemCount">0</span></div>
      <div class="summary-row summary-total"><span>Total</span><span id="totalPrice">₹0</span></div>
      <button class="btn btn-red" style="width:100%;margin-top:16px;font-size:16px" onclick="placeOrder()">
        <i class="fa fa-check-circle"></i> Place Order
      </button>
      <p style="font-size:12px;color:#888;text-align:center;margin-top:10px">
        You must be logged in to place an order.
      </p>
    </div>
  </div>

  <footer>
    <p class="footer-bottom">© 2025 Stylique</p>
  </footer>

  <!-- Razorpay checkout script — loads the payment popup -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script type="module">
    import { getCart, removeFromCart, clearCart, getCartTotal, updateCartBadge } from './js/cart.js';
    import { auth } from './js/auth.js';

    function renderCart() {
      const cart      = getCart();
      const listEl    = document.getElementById('cartItemsList');
      const summaryEl = document.getElementById('cartSummary');
      const emptyEl   = document.getElementById('emptyMsg');

      updateCartBadge();

      if (cart.length === 0) {
        listEl.innerHTML = '';
        summaryEl.style.display = 'none';
        emptyEl.style.display   = 'block';
        return;
      }

      emptyEl.style.display   = 'none';
      summaryEl.style.display = 'block';

      listEl.innerHTML = cart.map((item, i) => `
        <div class="cart-item-card">
          <img src="images/${item.image}" alt="${item.title}" />
          <div class="item-info">
            <h4>${item.title}</h4>
            <p>Size: <strong>${item.size}</strong></p>
            <p>Rental: <strong>${item.startDate}</strong> → <strong>${item.returnDate}</strong></p>
            <p style="color:#800020;font-weight:700;margin-top:6px">₹${item.price.toLocaleString('en-IN')}</p>
          </div>
          <button class="remove-btn" onclick="removeItem(${i})" title="Remove">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      `).join('');

      document.getElementById('itemCount').textContent  = cart.length;
      document.getElementById('totalPrice').textContent = `₹${getCartTotal().toLocaleString('en-IN')}`;
    }

    window.removeItem = (index) => {
      removeFromCart(index);
      renderCart();
    };

    // STEP 1 — Create Razorpay order on backend, then open payment popup
    window.placeOrder = async () => {
      const user = auth.currentUser;

      if (!user) {
        alert('Please log in to place your order.');
        window.location.href = 'login.html';
        return;
      }

      const cart  = getCart();
      const total = getCartTotal();
      if (cart.length === 0) { alert('Your cart is empty.'); return; }

      try {
        // Call backend to create Razorpay order
        const res  = await fetch('/api/orders/create-razorpay-order', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ total })
        });
        const data = await res.json();
        if (!data.success) { alert('Payment init failed. Try again.'); return; }

        // STEP 2 — Open Razorpay popup
        const options = {
          key:         'rzp_test_TU5PP2WfMyzU6X', // your public key ID
          amount:      data.order.amount,           // in paise from backend
          currency:    'INR',
          name:        'Stylique',
          description: 'Clothing Rental Payment',
          order_id:    data.order.id,               // Razorpay order ID from backend
          prefill: {
            email: user.email
          },
          theme: { color: '#800020' },

          // STEP 3 — Called automatically when payment succeeds
          handler: async (response) => {
            try {
              const verifyRes = await fetch('/api/orders/verify-and-save', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                  razorpay_order_id:   response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature:  response.razorpay_signature,
                  userId:    user.uid,
                  userEmail: user.email,
                  items:     cart,
                  total
                })
              });

              const verifyData = await verifyRes.json();

              if (verifyData.success) {
                clearCart();
                renderCart();
                alert('🎉 Payment successful! Order confirmed.');
                window.location.href = 'myaccount.html';
              } else {
                alert('Payment verification failed. Contact support.');
              }
            } catch (err) {
              console.error(err);
              alert('Error saving order. Contact support with payment ID: ' + response.razorpay_payment_id);
            }
          }
        };

        const rzp = new window.Razorpay(options);

        // Handle payment popup close / failure
        rzp.on('payment.failed', (response) => {
          alert('Payment failed: ' + response.error.description);
        });

        rzp.open();

      } catch (err) {
        console.error(err);
        alert('Server error. Please try again later.');
      }
    };

    renderCart();
  </script>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
